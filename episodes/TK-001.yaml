episode_id: TK-001
status: ready-for-flow
target_market: JP
audience: [teens, twenties]
format: healing_experiment
food: omurice
constraint: 3cm
length_target_seconds: 30
hook: "猫の手に卵を渡した結果…"
title: "猫の手で3cmオムライスは作れる？"
open_loops:
  - at_second: 0
    question: can_the_cat_make_it
  - at_second: 9
    question: will_the_egg_tear
  - at_second: 22
    question: what_will_the_cat_choose
payoff: parsley_twist
resolution: cat_ignores_omurice_and_takes_parsley
loop_end: reuse_opening_keyframe_after_parsley_twist
brand_identity:
  hero_cat: HERO_CAT_V1
  kitchen_world: KITCHEN_WORLD_V1
  canonical_doc: docs/24_hero_cat_brand_identity.md
  identity_priority_over_food_detail: true
  hero_cat_short_reference: "one cream-and-pale-ginger cat, round amber eyes, pink nose, soft round face, beige linen apron, real feline paws, no human fingers or thumbs"
flow_strategy:
  mode: progressive_h30_sequential_chain
  primary_model: veo-3.1-lite
  output_count: 1
  max_lite_generations_first_pass: 3
  non_ultra_credit_budget_first_pass: 30
  ultra_credit_budget_first_pass: 15
  frame_mode: sequential_actual_end_frame_plus_target_last
  keyframe_count: 4
  image_preflight_model: nano-banana-2-lite
  explicitly_select_image_model: true
  use_quality_only_for: [hero_food_reveal_after_format_wins]
  use_consistent_references: true
  do_not_generate_separate_cta_clip: true
  pacing: healing_motion_dense
  max_visual_cuts_per_8s_generation: 1
  preferred_action_count_per_generation: 1
  narration_policy: none_by_default
  audio_policy: keep_clean_native_audio_or_replace_in_edit
  progressive_spend_gate:
    g2_requires_g1_pass: true
    g3_requires_g2_pass: true
    stop_if_premise_or_identity_fails: true
    reroll_only_structural_failure: true
  sequential_chain:
    g2_start_source: save_actual_last_usable_frame_from_G1
    g3_start_source: save_actual_last_usable_frame_from_G2
    use_free_target_last_frames_when_helpful: true
  extend_trial:
    enabled: false
    reason: first production episode should prioritize controllable start/end continuity over an Extend experiment
  fourth_generation_requires_qc_failure_or_winner_gate: true
references:
  - HERO_CAT_V1
  - KITCHEN_WORLD_V1
  - PAN_MASTER
  - PLATE_MASTER
keyframes:
  KF0_OPEN: HERO_CAT_V1_real_feline_paw_beside_pearl_sized_egg_cup_tiny_pan_and_visible_3cm_rice_mound_no_finished_food
  KF1_EGG_SET: thin_yellow_omelet_has_just_set_in_tiny_pan_with_3cm_rice_mound_waiting_beside_it_same_HERO_CAT_V1_and_KITCHEN_WORLD_V1
  KF2_FOLD_SAFE: omelet_is_folded_around_3cm_rice_in_pan_intact_but_delicate_after_a_near_tear_same_HERO_CAT_V1_and_KITCHEN_WORLD_V1
  KF3_PAYOFF: finished_3cm_omurice_on_tiny_plate_steam_visible_HERO_CAT_V1_real_feline_paw_touching_parsley_instead_of_food
scenes:
  - id: G1
    generation_type: first_plus_last
    purpose: hook_plus_scale
    generation_seconds: 8
    start_frame: KF0_OPEN
    end_frame: KF1_EGG_SET
    action: cat_paw_slowly_tilts_the_pearl_sized_egg_cup_into_the_tiny_pan_and_then_pauses_while_the_thin_egg_layer_sets
    action_guard: one_real_feline_paw_one_cup_one_pan_no_rice_cooking_no_camera_change_preserve_HERO_CAT_V1
  - id: G2
    generation_type: first_plus_last
    purpose: fragile_fold_conflict_and_recovery
    generation_seconds: 8
    start_frame: ACTUAL_LAST_USABLE_FRAME_G1
    end_frame: KF2_FOLD_SAFE
    action: using_one_tiny_spatula_the_cat_paw_slowly_folds_the_thin_omelet_around_the_already_prepared_3cm_rice_the_edge_stretches_and_almost_tears_then_settles_intact
    action_guard: one_continuous_fold_no_extra_ingredients_no_plating_no_camera_change_preserve_actual_G1_cat_identity
  - id: G3
    generation_type: first_plus_last
    purpose: plating_plus_parsley_payoff
    generation_seconds: 8
    start_frame: ACTUAL_LAST_USABLE_FRAME_G2
    end_frame: KF3_PAYOFF
    action: cat_paw_slowly_slides_the_finished_3cm_omurice_onto_the_tiny_plate_and_pauses_for_steam_then_as_a_single_small_comic_beat_touches_and_takes_the_parsley
    action_guard: plating_is_the_primary_action_parsley_is_only_the_final_micro_beat_no_eating_no_camera_change_preserve_actual_G2_cat_identity
editorial_seconds:
  opening_keyframe_hold: 0.5
  environmental_room_hold: 0.5
  conflict_micro_hold: 0.2
  hero_frame_slow_push_in: 0.8
  reaction_hold: 0.5
  opening_keyframe_reuse_for_loop: 0.5
post_production:
  target_motion_density_pct_min: 85
  max_total_static_hold_seconds: 3
  preferred_playback_speed_range: [0.94, 1.00]
  slowdown_only_if_motion_remains_natural: true
  do_not_force_40_second_runtime: true
  preferred_final_runtime_seconds: [28, 31]
  generated_audio_policy: keep_clean_native_audio_within_each_take_otherwise_replace_with_reusable_isolated_asmr
  sound_bridge_between_visual_cuts: true
  narration_default: none
  narration_if_needed_max_lines: 2
creator_signature:
  narrator_angle: amused_witness_to_the_cats_bad_priorities
  signature_line: "そこまで作って、パセリなんだ。"
  delivery: optional_user_voice_only_if_ab_test_requires_it
audience_loop:
  mode: poll
  question: "次に3cmで作るなら？"
  options: ["ラーメン", "寿司"]
  next_manifest_seed: winning_option_becomes_candidate_food_but_requires_new_conflict_and_resolution
success_metrics:
  comparison_method: same_channel_same_observation_horizon_percentiles
  primary: [stayed_to_watch_pct, avg_percentage_viewed_pct]
  secondary: [subscribers_per_1000_engaged, comments_per_1000_engaged]
  external_reach_only: public_views
  snapshots_hours: [24, 72]
  no_universal_absolute_thresholds: true
originality_guard:
  unique_goal: make_3cm_omurice
  unique_conflict: omelet_almost_tears
  unique_ending: parsley_twist
  do_not_reuse_same_conflict_and_ending_pair_in_next_5_episodes: true
ip_story_guard:
  character_motivation: prove_the_tiny_shop_can_serve_a_real_signature_dish
  world_state_change: first_signature_menu_item_is_completed
  callback_or_new_lore: cat_prefers_garnish_over_the_dish_it_worked_hard_to_make
episode_fingerprint:
  hook_mechanic: impossible_scale_reveal
  dominant_visual: yellow_omelet_macro
  conflict_mechanic: fragile_food_near_failure
  emotional_turn: relief_then_comedy
  ending_mechanic: unexpected_garnish_choice
