episode_id: TK-005
status: ready-for-flow
target_market: JP
audience: [teens, twenties]
format: healing_miniature_making_paws_only
food: yakiimo
constraint: 12mm_sweet_potato
length_target_seconds: 34
hook: "この小ささで、焼きいも作れる？"
title: "猫の前足で作る、12mmの焼きいも。"
brand_identity:
  hero_cat: HERO_CAT_V1
  kitchen_world: KITCHEN_WORLD_V1
  shorts_visual_grammar: POV_PAWS_MICROWORLD_V1
  visual_intent: mini_forest_style_paws_only_miniature_making
  canonical_docs:
    - docs/24_hero_cat_brand_identity.md
    - docs/25_pov_paws_microworld_grammar.md
camera_grammar:
  mode: first_person_cat_pov
  semantic_override: mini_forest_style_observational_maker_view
  preferred_angles: [high_oblique_maker_view, top_down_macro, tabletop_oblique_macro]
  first_person_required: false
  visible_cat_parts: [front_paws_only]
  hide_face_head_body: true
  paws_enter_from: lower_or_side_frame_edges_like_hands_in_miniature_cooking
  hero_object_size_mm: [10, 15]
  hero_object_paw_width_ratio: [0.18, 0.32]
  framing: macro_tabletop_workbench
  camera_motion: mostly_locked_gentle_observational_drift_only
  character_performance_shot_is_fail: true
  third_person_full_cat_is_fail: true
runtime_strategy:
  mode: immersive_h40
  target_final_runtime_seconds: [32, 35]
  minimum_distinct_motion_beats: 4
  fourth_beat_value: "quiet world-resolution: slide the same tiny roasting tray with the finished yakiimo into its diorama serving position, then paws withdraw while steam remains"
  do_not_pad_to_runtime: true
flow_strategy:
  mode: progressive_h40_sequential_chain
  primary_model: veo-3.1-lite
  output_count: 1
  max_lite_generations_first_pass: 4
  non_ultra_credit_budget_first_pass: 40
  frame_mode: sequential_actual_end_frame_plus_target_last
  narration_policy: none_by_default
  audio_policy: clean_close_tactile_asmr_no_generated_music
  pacing: healing_motion_dense
  max_visual_cuts_per_8s_generation: 0
  preferred_action_count_per_generation: 1
  progressive_spend_gate:
    g2_requires_g1_pass: true
    g3_requires_g2_pass: true
    g4_requires_g3_pass: true
    stop_if_pov_scale_anatomy_or_premise_fails: true
    reroll_only_structural_failure: true
  sequential_chain:
    g2_start_source: save_actual_last_usable_frame_from_G1
    g3_start_source: save_actual_last_usable_frame_from_G2
    g4_start_source: save_actual_last_usable_frame_from_G3
    use_free_target_last_frames_when_helpful: true
references:
  - HERO_CAT_V1_PAWS
  - POV_PAWS_MICROWORLD_V1
  - KITCHEN_WORLD_V1
  - MINI_FOREST_STYLE_HAND_CENTRIC_MAKING_ABSTRACTION
keyframes:
  KF0_OPEN: "realistic miniature cooking scene inspired only by the hand-centric making grammar of Mini Forest; high-oblique macro view over a tiny handcrafted wooden workbench; only two cream-and-pale-ginger feline front paws enter naturally from the lower side edges where human hands normally would; no cat face, head or body; between the paws sits one absurdly tiny 12mm purple sweet potato on a thumbnail-sized ceramic roasting tray; a tiny tabletop warmer is already fixed ahead of the tray; a tiny wooden serving niche is already visible at the far upper-right; shallow depth of field, real miniature materials, calm handcrafted realism"
  KF1_WARM: "same high-oblique maker-view camera, same paw identity, same workbench, same fixed warmer and same serving niche; the same 12mm sweet potato is gently warming on the same tiny ceramic roasting tray near the warmer, skin slightly darker; food remains dramatically smaller than either paw; realistic miniature cooking, no character-performance framing"
  KF2_CRACK: "same maker-view camera and miniature workbench; same warmer, tray and serving niche remain fixed; the sweet potato skin has one small natural crack with a very thin curl of steam; one feline paw lightly steadies the tray from the side without gripping; no human hand anatomy"
  KF3_OPEN: "same high-oblique macro maker-view, same workbench and props; the same tray has moved a few millimeters away from the warmer; the existing crack has widened naturally enough to reveal a bright golden center and soft steam; paws remain partial working limbs only, food still under one third paw width"
  KF4_SERVE: "same maker-view camera and handcrafted miniature workbench; the same already-visible serving niche now holds the same tiny ceramic roasting tray with the finished 12mm yakiimo; the warmer remains in its original location; feline paws are beginning to withdraw from the work area while warm steam remains; no new plate, cookware, shelf, cat face or body"
scenes:
  - id: G1
    generation_type: first_plus_last
    purpose: impossible_scale_reveal_and_warming
    generation_seconds: 8
    start_frame: KF0_OPEN
    end_frame: KF1_WARM
    action: "one feline front paw slowly nudges the thumbnail-sized roasting tray a few millimeters toward the already-present tiny tabletop warmer, then stops; the sweet potato itself barely moves"
    action_guard: "Mini Forest-style hand-centric miniature-making composition; camera observes the workbench from a stable high-oblique macro angle; front paws only; no cat face/head/body; no human hands or fingers; no tongs; no gripping; keep the 12mm sweet potato dramatically smaller than the paw; keep warmer and serving niche fixed; one calm action"
  - id: G2
    generation_type: first_plus_last
    purpose: slow_roast_and_skin_crack
    generation_seconds: 8
    start_frame: ACTUAL_LAST_USABLE_FRAME_G1
    end_frame: KF2_CRACK
    action: "one paw gently presses the edge of the tiny tray to steady it while heat darkens the skin; a small crack slowly appears and a thin wisp of steam escapes"
    action_guard: "preserve the same stable miniature-making camera, same paw anatomy and tiny scale; no tool grip; paw does not pick up food; same warmer and serving niche remain fixed; one material transformation"
  - id: G3
    generation_type: first_plus_last
    purpose: golden_center_reveal
    generation_seconds: 8
    start_frame: ACTUAL_LAST_USABLE_FRAME_G2
    end_frame: KF3_OPEN
    action: "one paw slowly slides the same tiny roasting tray a few millimeters away from the heat, then stops; during the quiet hold the existing crack widens naturally from residual warmth and the golden center becomes visible"
    action_guard: "one slide plus one passive material micro-beat; no cat character performance; paw never pinches the sweet potato; no fingers or thumbs; preserve same tray, maker-view camera, tiny scale, fixed warmer and serving niche"
  - id: G4
    generation_type: first_plus_last
    purpose: quiet_world_resolution
    generation_seconds: 8
    start_frame: ACTUAL_LAST_USABLE_FRAME_G3
    end_frame: KF4_SERVE
    action: "one paw slowly slides the same ceramic roasting tray holding the finished yakiimo into the already-visible miniature serving niche; both paws then withdraw a little while steam continues"
    action_guard: "same tray, warmer and serving niche; introduce no new plate, bowl, cookware, shelf or stall structure; keep the Mini Forest-style miniature-making observer camera; this is a quiet world-resolution beat, not runtime padding; no eating, customer, camera cut, face or full cat"
post_production:
  preferred_final_runtime_seconds: [32, 35]
  target_motion_density_pct_min: 82
  max_total_static_hold_seconds: 3
  preferred_playback_speed_range: [0.92, 1.00]
  slowdown_only_if_motion_remains_natural: true
  narration_default: none
  generated_audio_policy: keep_only_clean_tiny_close_asmr_otherwise_replace_in_edit
  sound_bridge_between_generations: true
  do_not_force_60_second_runtime: true
success_metrics:
  primary: [stayed_to_watch_pct, avg_percentage_viewed_pct]
  secondary: [engaged_views_per_credit, subscribers_per_100_credits, comments_per_1000_engaged]
  snapshots_hours: [24, 72]
originality_guard:
  unique_goal: make_a_12mm_yakiimo_with_cat_paws_in_realistic_miniature_cooking_style
  unique_conflict: heat_reveals_a_single_skin_crack_without_human_tool_use
  unique_ending: paws_slide_the_same_tiny_roasting_tray_into_a_diorama_serving_niche_and_withdraw
  do_not_copy_branded_food_or_other_creator_plot: true
episode_fingerprint:
  hook_mechanic: paw_to_object_impossible_scale_contrast
  dominant_visual: purple_12mm_sweet_potato_macro
  conflict_mechanic: slow_skin_crack
  emotional_turn: tiny_scale_awe_to_warm_reveal
