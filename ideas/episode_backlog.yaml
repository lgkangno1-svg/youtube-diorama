rules:
  - Scores are 0..20; weights above sum to 100.
  - Every production-eligible candidate currently retains visual_grammar=POV_PAWS_MICROWORLD_V1 only for tooling compatibility; semantically it means Mini Forest-style paws-only miniature making, not mandatory true first-person cat-eye POV.
  - Candidate premises should default to high-oblique maker view, top-down macro, or tabletop/side-oblique macro; literal first-person framing is optional only when it improves the making shot.
  - Full-cat character-performance, cat-job roleplay, face/head/body reveal, and human-like feline tool use are not production-eligible mechanics.
  - Hero food/object should normally read as 5..20mm and <=0.50 of one visible paw width unless a documented episode-specific reason says otherwise.
  - Prefer paw-safe action families such as nudge, press, pat, roll, steady, slide and tap; penalize precise pinch, twist, chopsticks, tongs or knife grip.
  - Seasonal timing is a bounded additive boost, not a replacement for Flow reliability, visual payoff, or audience evidence.
  - For dated Japanese events, prefer the rising-interest window before the peak: roughly 8..21 days before is the default sweet spot, 22..35 days before gets a smaller early-lead boost, and the final 7 days still get a strong but slightly lower boost.
  - For broad food seasons, use a peak_start..peak_end range and a shorter lead window so the concept can enter rotation just before stores, menus, and social conversation become saturated.
  - A seasonal candidate must include current Japanese evidence before production; a calendar date by itself is not evidence of demand.
  - Searchability means how naturally Japanese viewers may search or recognize the seasonal term; keep it 0..20 and do not inflate it without evidence.
  - Do not copy a benchmark plot, title, branded product, or exact ending.
  - Extract only the mechanic that made the reference attractive.
  - Reject an idea if it is too similar to any of the last five episode fingerprints.
  - Prefer one main object, one calm action chain, one visible problem, one satisfying resolution.
  - Flow reliability and expected credit efficiency outrank novelty when evidence is otherwise close.
  - Choose compact_h30 when 3 independent beats complete the tactile journey; choose immersive_h40 only when a fourth world-resolution/afterglow beat has independent value.
  - Trend ideas expire unless current Japanese evidence still exists at production time.
  - Never pad a weak concept with still frames or a meaningless G4 merely to hit a duration target.
